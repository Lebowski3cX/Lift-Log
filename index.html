<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0d0d0d">
<title>Lift Log — Adam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--bg4:#282828;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.16);
  --text:#f0f0f0;--text2:#8a8a8a;--text3:#4a4a4a;
  --accent:#f77f2a;--accent-dim:rgba(247,127,42,0.12);--accent-border:rgba(247,127,42,0.3);
  --r:14px;--rsm:10px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
.nav{display:flex;background:var(--bg);border-bottom:0.5px solid var(--border);padding:calc(var(--st) + 10px) 0 10px;flex-shrink:0}
.nb{flex:1;padding:6px 4px;background:none;border:none;color:var(--text2);font-size:10px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;letter-spacing:0.4px;text-transform:uppercase}
.nb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb.active{color:var(--accent)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none;padding-bottom:calc(var(--sb) + 20px)}
.screen.active{display:block}
.ph{padding:22px 18px 6px}
.pt{font-size:26px;font-weight:700;letter-spacing:-0.5px}
.ps{font-size:13px;color:var(--text2);margin-top:4px}
.btn{display:block;width:100%;padding:14px;background:var(--accent);color:#0d0d0d;font-size:15px;font-weight:700;border:none;border-radius:var(--rsm);cursor:pointer;text-align:center}
.btn:active{opacity:0.85}
.btn.sec{background:var(--bg3);color:var(--text);border:0.5px solid var(--border2);font-weight:600}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;margin:0 18px 12px}
.session-pick{display:flex;flex-direction:column;gap:10px;padding:0 18px}
.sp-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.sp-card:active{background:var(--bg3)}
.sp-card.recommended{border-color:var(--accent-border)}
.sp-icon{width:42px;height:42px;background:var(--accent-dim);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-icon svg{width:21px;height:21px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sp-info{flex:1;min-width:0}
.sp-name{font-size:15px;font-weight:600}
.sp-meta{font-size:12px;color:var(--text2);margin-top:2px}
.sp-badge{font-size:9px;font-weight:700;color:var(--accent);background:var(--accent-dim);border:0.5px solid var(--accent-border);padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap}
.sp-arrow{color:var(--text3);font-size:20px;flex-shrink:0}
.done-today{text-align:center;padding:28px 20px;margin:0 18px 16px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r)}
.done-today-icon{width:48px;height:48px;background:var(--accent-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.done-today-icon svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.done-today-t{font-size:16px;font-weight:700;margin-bottom:4px}
.done-today-s{font-size:12px;color:var(--text2)}
.divider{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;padding:14px 18px 8px}
/* SESSION OVERLAY */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:200;display:none;flex-direction:column;overflow:hidden}
.overlay.active{display:flex}
.ov-top{display:flex;align-items:center;padding:calc(var(--st) + 12px) 16px 12px;border-bottom:0.5px solid var(--border);flex-shrink:0;gap:10px}
.ov-end{font-size:12px;color:var(--text2);background:var(--bg3);border:0.5px solid var(--border2);padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.ov-title{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-timer{background:var(--accent-dim);border:0.5px solid var(--accent-border);border-radius:20px;padding:5px 11px;font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.round-badge{background:var(--accent-dim);border:0.5px solid var(--accent-border);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;flex-shrink:0}
.sess-prog-wrap{padding:12px 16px 0;flex-shrink:0}
.prog-bar{height:3px;background:var(--bg3);border-radius:2px}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.25s}
.prog-lbl{font-size:11px;color:var(--text2);padding:6px 2px 0}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px}
.ov-footer{padding:10px 16px calc(var(--sb) + 14px);flex-shrink:0}
.eli{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;display:flex;align-items:center;padding:13px 14px;cursor:pointer;gap:12px}
.eli:active{background:var(--bg3)}
.eli.done{border-color:var(--accent-border)}
.eli.current{border-color:var(--accent);border-width:1px}
.eli-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--accent);transition:all 0.15s}
.eli-check.done{background:var(--accent);border-color:var(--accent);color:#0d0d0d}
.eli-check.current{border-color:var(--accent)}
.eli-info{flex:1;min-width:0}
.eli-name{font-size:15px;font-weight:500}
.eli-name.done{color:var(--text3);text-decoration:line-through}
.eli-target{font-size:12px;color:var(--text2);margin-top:2px}
.eli-mark{font-size:10px;color:var(--accent);font-weight:700;flex-shrink:0}
.finish-btn{display:block;width:100%;padding:14px;background:var(--bg3);color:var(--text);font-size:15px;font-weight:700;border:0.5px solid var(--border2);border-radius:var(--rsm);cursor:pointer;text-align:center;transition:all 0.2s}
.finish-btn.ready{background:var(--accent);color:#0d0d0d;border-color:var(--accent)}
/* INFO SHEET */
.sheet-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:500;display:none;align-items:flex-end}
.sheet-bg.active{display:flex}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 20px calc(var(--sb) + 24px);max-height:78vh;overflow-y:auto;width:100%}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:6px}
.sheet-summary{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:16px}
.sheet-section{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;margin-top:14px;font-weight:700}
.sheet-cue{font-size:14px;color:var(--text);padding:7px 0;border-bottom:0.5px solid var(--border);line-height:1.4}
.sheet-cue:before{content:"→ ";color:var(--accent)}
.sheet-feel{font-size:13px;color:var(--text2);line-height:1.5;margin-top:4px}
.sheet-avoid{font-size:13px;color:#ff6b5c;line-height:1.5;margin-top:4px}
.sheet-yt{display:block;margin-top:18px;padding:12px;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--r);color:var(--accent);font-size:13px;font-weight:700;text-align:center;text-decoration:none}
.info-btn{background:var(--accent-dim);border:0.5px solid var(--accent-border);color:var(--accent);font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;white-space:nowrap;flex-shrink:0}
/* DONE SCREEN */
.done-wrap{background:var(--bg);padding:32px 20px;text-align:center;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.done-icon{width:56px;height:56px;background:var(--accent-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.done-icon svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.done-title{font-size:23px;font-weight:700;margin-bottom:6px}
.done-sub{font-size:13px;color:var(--text2);margin-bottom:26px}
.done-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:280px;margin-bottom:28px}
.done-stat{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:16px 10px}
.done-stat-val{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:-0.5px}
.done-stat-unit{font-size:14px}
.done-stat-lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;font-weight:700}
.done-btn{width:100%;max-width:280px}
/* HISTORY */
.hist-item{margin:0 18px 10px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.hist-head{padding:13px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
.hist-icon{width:34px;height:34px;background:var(--accent-dim);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hist-icon svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hist-mid{flex:1;min-width:0}
.hist-date{font-size:14px;font-weight:600}
.hist-name{font-size:12px;color:var(--text2);margin-top:1px}
.hist-time{font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}
.hist-chev{color:var(--text3);font-size:16px;transition:transform 0.2s;flex-shrink:0}
.hist-chev.open{transform:rotate(180deg)}
.hist-body{display:none;border-top:0.5px solid var(--border)}
.hist-body.open{display:block}
.hist-ex{padding:8px 14px;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px}
.hist-ex+.hist-ex{border-top:0.5px solid var(--border)}
.hist-ex-check{color:var(--accent);font-size:12px}
/* PROGRESS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 8px}
.stat-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:16px}
.stat-lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;font-weight:700}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-0.5px;color:var(--accent)}
.stat-unit{font-size:13px;color:var(--text2);font-weight:400}
.cal-wrap{margin:8px 18px 16px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:16px}
.cal-title{font-size:13px;font-weight:600;margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day{aspect-ratio:1;border-radius:6px;background:var(--bg3)}
.cal-day.done{background:var(--accent)}
.empty{text-align:center;padding:60px 24px;color:var(--text2)}
.empty-t{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-s{font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <nav class="nav">
    <button class="nb active" onclick="showScreen('today')" id="nav-today">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Today
    </button>
    <button class="nb" onclick="showScreen('progress')" id="nav-progress">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Progress
    </button>
    <button class="nb" onclick="showScreen('history')" id="nav-history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>History
    </button>
  </nav>

  <div class="screen active" id="screen-today">
    <div class="ph"><div class="pt" id="today-day"></div><div class="ps" id="today-date"></div></div>
    <div id="today-content"></div>
    <div class="divider">All sessions</div>
    <div class="session-pick" id="all-sessions"></div>
  </div>

  <div class="screen" id="screen-progress">
    <div class="ph"><div class="pt">Progress</div><div class="ps">Last 4 weeks</div></div>
    <div class="stat-grid" id="stat-grid"></div>
    <div class="cal-wrap">
      <div class="cal-title">Last 28 days</div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>

  <div class="screen" id="screen-history">
    <div class="ph"><div class="pt">History</div><div class="ps">All logged sessions</div></div>
    <div id="history-list"></div>
  </div>
</div>

<!-- SESSION OVERLAY -->
<div class="overlay" id="ov-session">
  <div class="ov-top">
    <button class="ov-end" id="ov-end" onclick="endSession()">✕ End</button>
    <div class="ov-title" id="ov-session-title"></div>
    <div class="round-badge" id="round-badge" style="display:none"></div>
    <div class="ov-timer" id="ov-timer">0:00</div>
  </div>
  <div class="sess-prog-wrap">
    <div class="prog-bar"><div class="prog-fill" id="sess-prog-bar" style="width:0%"></div></div>
    <div class="prog-lbl" id="sess-prog-lbl"></div>
  </div>
  <div class="ov-body" id="ov-session-body"></div>
  <div class="ov-footer">
    <button class="finish-btn" id="finish-btn" onclick="finishSession()">Finish session</button>
  </div>
</div>

<!-- DONE OVERLAY -->
<div class="overlay" id="ov-done">
  <div class="done-wrap">
    <div class="done-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <div class="done-title">Session done</div>
    <div class="done-sub" id="done-sub"></div>
    <div class="done-stats">
      <div class="done-stat"><div class="done-stat-val" id="done-time">0<span class="done-stat-unit">m</span></div><div class="done-stat-lbl">Duration</div></div>
      <div class="done-stat"><div class="done-stat-val" id="done-count">0<span class="done-stat-unit">/0</span></div><div class="done-stat-lbl">Completed</div></div>
    </div>
    <button class="btn done-btn" onclick="closeDone()">Back to home</button>
  </div>
</div>

<!-- INFO SHEET -->
<div class="sheet-bg" id="sheet-bg" onclick="closeInfo(event)">
  <div class="sheet" id="info-sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<script>
// ===================== EXERCISE INFO LIBRARY =====================
const EX={
"Pull ups":{icon:"pull",summary:"Hang from a bar and pull your chin over it. One of the best upper body pulling movements you can do.",setup:"Hang from the bar, hands slightly wider than shoulder-width, overhand grip. Full hang to start.",cues:["Depress your shoulder blades before you pull — 'shoulders in back pockets'","Drive elbows down and back toward your hips","Chin over the bar, then lower with control","Full dead hang at the bottom each rep"],feel:"Lats doing the driving. Biceps assisting.",avoid:"Kipping or swinging. Half reps.",yt:"pull up form tutorial for beginners"},
"Dips":{icon:"dip",summary:"Lower and press your bodyweight on parallel bars or a sturdy chair/bench edge. Builds chest and triceps fast.",setup:"Hands on bars or bench edges, arms extended, body upright for a balanced chest/tricep mix.",cues:["Lower until upper arms are roughly parallel to the floor","Keep elbows tucking back — not flaring out","Press back up to full extension","Stay controlled — don't drop into the bottom"],feel:"Chest and triceps working together.",avoid:"Going too deep if you feel shoulder discomfort. Elbows flaring wide.",yt:"tricep dips form parallel bars"},
"Dumbbell Row":{icon:"row",summary:"One arm braced on a bench, pulling a dumbbell to your hip. Great back thickness builder.",setup:"One hand and knee on a bench, dumbbell hanging, back flat and parallel to the ground.",cues:["Pull dumbbell up and back toward your hip — not your armpit","Drive elbow up toward the ceiling","Shoulder blade pulls back at the top","Lower with control — full stretch at bottom"],feel:"Lat and mid-back. Feel the stretch at the bottom of each rep.",avoid:"Rotating your torso to help. Pulling toward your shoulder instead of your hip.",yt:"dumbbell row form tutorial"},
"Dumbbell Bench Press":{icon:"chest",summary:"Flat bench press with dumbbells. Great range of motion, each side works independently.",setup:"Sit with dumbbells on your knees, kick back to lying position. Dumbbells at chest, palms forward.",cues:["Lower until elbows are just below bench level","Press up and slightly together","Keep wrists stacked over elbows","Control the descent — don't drop them"],feel:"Deep chest stretch at the bottom.",avoid:"Dumbbells drifting too wide. Losing tension by touching them at the top.",yt:"dumbbell bench press form"},
"Dumbbell OHP":{icon:"press",summary:"Overhead press with dumbbells. Each side works independently — good for shoulder balance.",setup:"Seated or standing, dumbbells at shoulder height, palms facing forward.",cues:["Press both dumbbells up until arms are extended overhead","Slight inward arc at the top","Lower to shoulder height and repeat","Keep core braced if standing"],feel:"Shoulders driving. Triceps locking out.",avoid:"Letting dumbbells drift too far forward or back at the top.",yt:"dumbbell overhead press form"},
"Lateral Raise":{icon:"lateral",summary:"Dumbbells raised out to the sides to shoulder height. Builds width in the shoulders.",setup:"Stand with dumbbells at your sides, slight forward lean and soft elbow bend.",cues:["Lead with your elbows, not your hands","Raise to shoulder height — no higher","Pinky slightly higher than thumb at the top","Lower slowly — 3 seconds down"],feel:"Side delt burning, especially on the slow descent.",avoid:"Using momentum. Shrugging your traps to get them higher.",yt:"lateral raise form tutorial"},
"Hammer Curl":{icon:"curl",summary:"Curl with a neutral grip. Hits the forearm and outer bicep — adds thickness to the arm.",setup:"Stand with dumbbells at sides, palms facing your body, thumbs forward.",cues:["Curl straight up — no wrist rotation","Elbows stay at your sides","Squeeze at the top","Slow descent"],feel:"More forearm and outer bicep than a regular curl.",avoid:"Rotating the wrist — that turns it into a regular curl.",yt:"hammer curl form tutorial"},
"Plank":{icon:"core",summary:"Hold a push-up position on your forearms. Builds core stability and endurance.",setup:"Forearms on the floor, elbows under shoulders, body in a straight line head to heels.",cues:["Squeeze your glutes and brace your abs","Don't let your hips sag or pike up","Breathe normally — don't hold your breath","Neutral neck — don't drop your head"],feel:"Core, glutes, and shoulders all working together.",avoid:"Hips sagging — the most common fault.",yt:"plank proper form tutorial"},
"Doorframe Pull ups":{icon:"pull",summary:"Same movement as gym pull ups, using your doorframe bar at home.",setup:"Hang from the bar, hands slightly wider than shoulder-width, overhand grip.",cues:["Depress shoulder blades before you pull","Drive elbows down and back","Chin over the bar, lower with control","Full dead hang each rep"],feel:"Lats driving, biceps assisting.",avoid:"Swinging. Half reps.",yt:"pull up form tutorial for beginners"},
"Bench/Chair Dips":{icon:"dip",summary:"Dips using a sturdy chair or bench at home instead of parallel bars.",setup:"Hands on the edge of a chair or bench behind you, legs extended in front, body lowering straight down.",cues:["Lower until elbows are at roughly 90 degrees","Keep elbows tracking backward, not flaring","Press back up through your palms","Keep hips close to the bench throughout"],feel:"Triceps and chest.",avoid:"Shoulders rolling forward. Going too deep if it pinches.",yt:"chair tricep dips form"},
"Band Row":{icon:"row",summary:"Seated or standing row using a resistance band anchored to a door or post.",setup:"Anchor the band at mid-height, hold both ends, sit or stand facing the anchor point.",cues:["Pull band to your stomach — drive elbows back","Squeeze shoulder blades together at the end","Return slowly with arms fully extended","Sit or stand tall — don't round your back"],feel:"Mid-back and lats.",avoid:"Rounding your back. Using momentum.",yt:"resistance band row form"},
"Barbell Curl":{icon:"curl",summary:"Standing bicep curl using your home barbell set.",setup:"Stand with the barbell, shoulder-width underhand grip, arms fully extended.",cues:["Curl the bar up to your shoulders — elbows stay fixed at your sides","Squeeze biceps hard at the top","Lower slowly — 2-3 seconds down","Full extension at the bottom"],feel:"Biceps contracting throughout.",avoid:"Swinging your back to get the weight up.",yt:"barbell curl form tutorial"},
"Band Overhead Press":{icon:"press",summary:"Overhead press using a resistance band — good home substitute for dumbbell OHP.",setup:"Stand on the band, feet hip-width, hold the band at shoulder height.",cues:["Press both hands overhead to full extension","Core braced — don't arch your lower back","Lower back to shoulder height under control","Tension increases as you press higher"],feel:"Shoulders and triceps.",avoid:"Arching your lower back as you press.",yt:"resistance band overhead press form"},
"Banded Clamshell":{icon:"knee",summary:"Lying on your side with a band around your knees — key movement for knee and hip stability.",setup:"Lie on your side, hips stacked, knees bent 90 degrees, band around your knees.",cues:["Rotate your top knee upward like a clamshell opening","Keep your heels together throughout","Go as high as you can without your hip rolling back","Lower slowly — resist the band"],feel:"Outer glute and hip — small movement, builds fast.",avoid:"Hip rolling backward for more range.",yt:"banded clamshell form tutorial"},

const DAY_DEFAULT={1:'gym',3:'gym',4:'circuit',6:'pool'}; // Mon=1 Wed=3 Thu=4 Sat=6

function getData(){try{return JSON.parse(localStorage.getItem('liftlog2_v1')||'[]')}catch(e){return[]}}
function saveData(d){localStorage.setItem('liftlog2_v1',JSON.stringify(d))}
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0')}

function showScreen(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+n).classList.add('active');
  document.getElementById('nav-'+n).classList.add('active');
  if(n==='progress')renderProgress();
  if(n==='history')renderHistory();
}

function iconSvg(name,size){return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${ICONS[name]||ICONS.core}</svg>`}

function renderToday(){
  const now=new Date(),dow=now.getDay();
  document.getElementById('today-day').textContent=now.toLocaleDateString('en-GB',{weekday:'long'});
  document.getElementById('today-date').textContent=now.toLocaleDateString('en-GB',{day:'numeric',month:'long'});
  const data=getData(),todayStr=now.toISOString().slice(0,10);
  const loggedToday=data.filter(s=>s.date===todayStr);
  const defaultId=DAY_DEFAULT[dow];
  let html='';
  if(loggedToday.length){
    loggedToday.forEach(s=>{
      html+=`<div class="done-today"><div class="done-today-icon">${iconSvg('core',24)}</div><div class="done-today-t">${s.name} done</div><div class="done-today-s">${s.duration?fmtTime(s.duration)+' · ':''}${s.completed}/${s.total} exercises</div></div>`;
    });
  }
  if(defaultId){
    const s=SESSIONS[defaultId];
    html+=`<div class="session-pick" style="margin-bottom:4px"><div class="sp-card recommended" onclick="startSession('${defaultId}')"><div class="sp-icon">${iconSvg(s.icon,21)}</div><div class="sp-info"><div class="sp-name">${s.name}</div><div class="sp-meta">${s.meta}</div></div><div class="sp-badge">Today</div></div></div>`;
  } else if(!loggedToday.length){
    html+=`<div class="empty" style="padding:40px 24px 20px"><div class="empty-t">Rest day</div><div class="empty-s">No session scheduled. Pick one below if you feel like moving.</div></div>`;
  }
  document.getElementById('today-content').innerHTML=html;
  renderAllSessions(defaultId);
}

function renderAllSessions(defaultId){
  let html='';
  Object.values(SESSIONS).forEach(s=>{
    if(s.id===defaultId)return;
    html+=`<div class="sp-card" onclick="startSession('${s.id}')"><div class="sp-icon">${iconSvg(s.icon,21)}</div><div class="sp-info"><div class="sp-name">${s.name}</div><div class="sp-meta">${s.meta}</div></div><div class="sp-arrow">›</div></div>`;
  });
  document.getElementById('all-sessions').innerHTML=html;
}

// ===================== ACTIVE SESSION =====================
let S={};
let timerInterval=null;

function startSession(id){
  const session=SESSIONS[id];
  S={sessionId:id,session,done:{},round:1,startTime:Date.now(),elapsed:0};
  session.exercises.forEach((_,i)=>{S.done[i]=false;});
  endConfirmPending=false;
  const endBtn=document.getElementById('ov-end');
  endBtn.textContent='✕ End';
  endBtn.style.background='';endBtn.style.borderColor='';endBtn.style.color='';
  document.getElementById('ov-session-title').textContent=session.name;
  document.getElementById('round-badge').style.display=session.order==='circuit'?'block':'none';
  document.getElementById('ov-session').classList.add('active');
  startTimer();
  renderSessionBody();
}

function startTimer(){
  updateTimerDisplay();
  timerInterval=setInterval(()=>{
    S.elapsed=Math.floor((Date.now()-S.startTime)/1000);
    updateTimerDisplay();
  },1000);
}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}
function updateTimerDisplay(){document.getElementById('ov-timer').textContent=fmtTime(S.elapsed);}

function doneCount(){return Object.values(S.done).filter(Boolean).length}

function renderSessionBody(){
  const session=S.session,total=session.exercises.length,done=doneCount();
  document.getElementById('sess-prog-bar').style.width=Math.round((done/total)*100)+'%';
  if(session.order==='circuit'){
    document.getElementById('round-badge').textContent=`Round ${S.round}/${session.rounds}`;
    document.getElementById('sess-prog-lbl').textContent=`Round ${S.round} of ${session.rounds} · ${done} of ${total} exercises`;
  } else {
    document.getElementById('sess-prog-lbl').textContent=`${done} of ${total} done`;
  }
  let html='';
  session.exercises.forEach((ex,i)=>{
    const isDone=S.done[i];
    html+=`<div class="eli ${isDone?'done':''}" onclick="toggleExercise(${i})">
      <div class="eli-check ${isDone?'done':''}">${isDone?'✓':''}</div>
      <div class="eli-info">
        <div class="eli-name ${isDone?'done':''}">${ex.name}</div>
        <div class="eli-target">${ex.target}</div>
      </div>
      <button class="info-btn" onclick="event.stopPropagation();openInfo(${i})">How to</button>
    </div>`;
  });
  document.getElementById('ov-session-body').innerHTML=html;
  const finishBtn=document.getElementById('finish-btn');
  if(done===total){
    finishBtn.classList.add('ready');
    finishBtn.textContent='Finish session ✓';
  } else {
    finishBtn.classList.remove('ready');
    finishBtn.textContent='Finish session';
  }
}

function toggleExercise(i){
  S.done[i]=!S.done[i];
  const session=S.session;
  if(session.order==='circuit' && doneCount()===session.exercises.length && S.round<session.rounds){
    setTimeout(()=>{
      S.round++;
      session.exercises.forEach((_,j)=>{S.done[j]=false;});
      renderSessionBody();
    },350);
  }
  renderSessionBody();
}

function openInfo(i){
  const ex=S.session.exercises[i];
  const info=EX[ex.name];
  if(!info){document.getElementById('sheet-content').innerHTML=`<div class="sheet-title">${ex.name}</div><p style="color:var(--text2);font-size:14px;margin-top:8px">No description available yet.</p>`;document.getElementById('sheet-bg').classList.add('active');return;}
  const ytUrl=`https://www.youtube.com/results?search_query=${encodeURIComponent(info.yt)}`;
  let html=`<div class="sheet-title">${ex.name}</div><div class="sheet-summary">${info.summary}</div>`;
  if(info.setup){html+=`<div class="sheet-section">Setup</div><div class="sheet-feel">${info.setup}</div>`;}
  html+=`<div class="sheet-section">Key cues</div>`;
  info.cues.forEach(c=>{html+=`<div class="sheet-cue">${c}</div>`;});
  html+=`<div class="sheet-section">What to feel</div><div class="sheet-feel">${info.feel}</div>`;
  html+=`<div class="sheet-section">Avoid</div><div class="sheet-avoid">${info.avoid}</div>`;
  html+=`<a class="sheet-yt" href="${ytUrl}" target="_blank">▶ Watch on YouTube</a>`;
  document.getElementById('sheet-content').innerHTML=html;
  document.getElementById('sheet-bg').classList.add('active');
}
function closeInfo(e){if(e.target===document.getElementById('sheet-bg'))document.getElementById('sheet-bg').classList.remove('active');}

let endConfirmPending=false;
function endSession(){
  const btn=document.getElementById('ov-end');
  if(!endConfirmPending){
    endConfirmPending=true;
    btn.textContent='Tap to confirm';
    btn.style.background='var(--accent-dim)';
    btn.style.borderColor='var(--accent-border)';
    btn.style.color='var(--accent)';
    setTimeout(()=>{
      if(endConfirmPending){
        endConfirmPending=false;
        btn.textContent='✕ End';
        btn.style.background='';
        btn.style.borderColor='';
        btn.style.color='';
      }
    },2500);
    return;
  }
  endConfirmPending=false;
  stopTimer();
  document.getElementById('ov-session').classList.remove('active');
}

function finishSession(){
  stopTimer();
  const session=S.session;
  const totalForRecord=session.order==='circuit'?session.exercises.length*session.rounds:session.exercises.length;
  const doneForRecord=session.order==='circuit'?(S.round-1)*session.exercises.length+doneCount():doneCount();
  const data=getData();
  data.push({id:Date.now(),date:new Date().toISOString().slice(0,10),sessionId:session.id,name:session.name,duration:S.elapsed,completed:doneForRecord,total:totalForRecord,exercises:session.exercises.filter((_,i)=>S.done[i]).map(e=>e.name)});
  saveData(data);
  document.getElementById('ov-session').classList.remove('active');
  document.getElementById('done-sub').textContent=session.name;
  document.getElementById('done-time').innerHTML=Math.round(S.elapsed/60)+'<span class="done-stat-unit">m</span>';
  document.getElementById('done-count').innerHTML=doneForRecord+'<span class="done-stat-unit">/'+totalForRecord+'</span>';
  document.getElementById('ov-done').classList.add('active');
}
function closeDone(){document.getElementById('ov-done').classList.remove('active');renderToday();}

// ===================== PROGRESS =====================
function renderProgress(){
  const data=getData();
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-28);
  const recent=data.filter(s=>new Date(s.date)>=cutoff);
  const sg=document.getElementById('stat-grid');
  const totalSessions=recent.length;
  const totalMinutes=recent.reduce((a,s)=>a+(s.duration||0),0)/60;
  const avgMinutes=totalSessions?Math.round(totalMinutes/totalSessions):0;
  const uniqueDays=new Set(recent.map(s=>s.date)).size;
  sg.innerHTML=`
    <div class="stat-card"><div class="stat-lbl">Sessions</div><div class="stat-val">${totalSessions}</div></div>
    <div class="stat-card"><div class="stat-lbl">Active days</div><div class="stat-val">${uniqueDays}</div></div>
    <div class="stat-card"><div class="stat-lbl">Avg duration</div><div class="stat-val">${avgMinutes}<span class="stat-unit"> min</span></div></div>
    <div class="stat-card"><div class="stat-lbl">Total time</div><div class="stat-val">${Math.round(totalMinutes)}<span class="stat-unit"> min</span></div></div>
  `;
  const doneDates=new Set(data.map(s=>s.date));
  let calHtml='';
  for(let i=27;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    calHtml+=`<div class="cal-day ${doneDates.has(key)?'done':''}"></div>`;
  }
  document.getElementById('cal-grid').innerHTML=calHtml;
}

// ===================== HISTORY =====================
function renderHistory(){
  const data=getData().slice().reverse();
  const el=document.getElementById('history-list');
  if(!data.length){el.innerHTML=`<div class="empty"><div class="empty-t">No sessions yet</div><div class="empty-s">Your logged sessions will appear here.</div></div>`;return;}
  el.innerHTML=data.map((s,i)=>{
    const session=SESSIONS[s.sessionId];
    const icon=session?session.icon:'core';
    return `<div class="hist-item"><div class="hist-head" onclick="toggleHist(${i})">
      <div class="hist-icon">${iconSvg(icon,17)}</div>
      <div class="hist-mid"><div class="hist-date">${fmtDate(s.date)}</div><div class="hist-name">${s.name}</div></div>
      <div class="hist-time">${s.duration?fmtTime(s.duration):'—'}</div>
      <div class="hist-chev" id="hc-${i}">⌄</div>
    </div>
    <div class="hist-body" id="hb-${i}">
      ${(s.exercises||[]).map(n=>`<div class="hist-ex"><span class="hist-ex-check">✓</span>${n}</div>`).join('')}
      <div class="hist-ex" style="color:var(--text3)">${s.completed}/${s.total} exercises completed</div>
    </div></div>`;
  }).join('');
}
function toggleHist(i){document.getElementById('hb-'+i).classList.toggle('open');document.getElementById('hc-'+i).classList.toggle('open');}

renderToday();
</script>
